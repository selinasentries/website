<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#294944"><title>Contact | Selly</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap');
:root{--forest:#294944;--accent:#6B7F82;--paper:#fbfbf8;--ink:#202725;--mist:#e5ebea;--muted:#78827f;--line:rgba(32,39,37,.2)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--forest);padding:clamp(12px,5vw,68px);font-family:'DM Sans',sans-serif;color:var(--ink)}
a{color:inherit;text-decoration:none}.site{max-width:1400px;margin:auto;background:var(--paper);box-shadow:0 25px 65px #10201d40;overflow:hidden;min-height:70vh}
header{height:72px;padding:0 clamp(20px,5vw,68px);display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{align-self:flex-start;width:38px;height:52px;background:var(--ink);color:white;display:grid;place-items:center;font:300 17px Manrope,sans-serif;letter-spacing:-2px}
nav{display:flex;gap:clamp(14px,3.5vw,44px)}nav a,.social{font-size:10px;color:#505a57}nav a:hover,nav a.active{color:var(--accent)}
.eyebrow{font:10px Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:17px}
h1,h2{font-family:Manrope,sans-serif;font-weight:300;letter-spacing:-.06em}
.hero{min-height:465px;display:grid;grid-template-columns:minmax(210px,.8fr) minmax(300px,1.35fr);align-items:center;gap:18px;position:relative;padding:10px clamp(22px,5vw,68px) 32px;isolation:isolate}
.hero:before{content:"01";position:absolute;z-index:-1;right:0;top:34%;width:48%;height:140px;background:var(--mist);font:300 clamp(80px,12vw,145px)/1 Manrope,sans-serif;text-align:right;color:white;padding-right:18px;overflow:hidden}
.copy{position:relative;padding:20px 0 20px 26px}.vertical{position:absolute;left:0;top:50%;transform:translate(-100%,-50%) rotate(180deg);writing-mode:vertical-rl;font:300 23px Manrope,sans-serif;letter-spacing:.06em}
h1{font-size:clamp(38px,5vw,68px);line-height:.98}h1 span{display:block;font-weight:500}
.sub{font:500 11px/1.8 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:15px 0}
.intro{max-width:245px;font-size:11px;line-height:1.8;color:var(--muted);margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:17px;background:var(--ink);color:white;padding:11px 15px;font-size:9px;letter-spacing:.08em}.btn:hover{background:var(--accent)}
.card-area{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px 0 24px}
.card-instruction{align-self:flex-end;font:9px Manrope,sans-serif;letter-spacing:.13em;color:var(--muted);text-align:right}
.card-scene{width:min(100%,500px);perspective:1200px;cursor:pointer;touch-action:manipulation;outline-offset:8px}
.flip-card{width:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1);aspect-ratio:1.5}
.flip-card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.card-face img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.card-back{transform:rotateY(180deg)}.card-shadow{position:absolute;left:8%;right:8%;bottom:2%;height:26px;border:1.5px solid var(--ink);border-radius:50%;pointer-events:none}
.card-label{font:8px Manrope,sans-serif;letter-spacing:.18em;color:var(--muted);text-align:center}
.card-controls{display:flex;align-items:center;gap:12px;font-size:9px;color:var(--muted);letter-spacing:.12em}
.flip-button{background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 10px;cursor:pointer;font-size:10px}.flip-button:hover{background:var(--accent);color:white}
.hero-bottom{margin:0 clamp(22px,5vw,68px);padding:14px 0 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;font:9px Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.page-content{padding:58px clamp(22px,5vw,68px) 70px;min-height:430px}
.page-title{font-size:clamp(38px,5vw,62px);line-height:1;margin-bottom:16px}
.page-intro{max-width:540px;color:var(--muted);font-size:12px;line-height:1.9;margin-bottom:30px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 15px}
.project-image{aspect-ratio:4/3;background:var(--mist);overflow:hidden;position:relative}.project-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}.project:hover img{transform:scale(1.04)}
.number{position:absolute;left:10px;top:10px;background:var(--paper);padding:6px 8px;font:9px Manrope,sans-serif}
.project-info{display:flex;justify-content:space-between;padding-top:11px;gap:10px}.project-info h3{font-size:13px;font-weight:500}.project-info p{margin-top:5px;color:var(--muted);font:9px Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.about-layout{display:grid;grid-template-columns:1fr 1fr;gap:28px}.about-layout p{font-size:12px;line-height:1.9;color:var(--muted);max-width:480px}
.contact-panel{background:var(--accent);color:white;padding:28px;max-width:650px}.contact-panel h2{font-size:clamp(26px,4vw,42px);margin-bottom:15px}.contact-panel p{font-size:12px;line-height:1.8;margin-bottom:20px}.contact-panel a{border:1px solid #ffffffb3;padding:11px 14px;font-size:9px;letter-spacing:.1em;display:inline-block}
footer{display:flex;justify-content:space-between;gap:14px;padding:16px clamp(22px,5vw,68px);font:9px Manrope,sans-serif;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;border-top:1px solid var(--line)}
@media(max-width:720px){body{padding:0}header{height:64px;padding:0 18px}.logo{width:32px;height:46px}nav{gap:13px}nav a{font-size:9px}.hero{grid-template-columns:1fr;padding:18px 20px 28px;gap:4px}.copy{padding-left:23px;padding-top:15px}.vertical{font-size:18px}.hero:before{top:48%;width:70%;height:100px}.card-area{padding:8px 0 24px}.card-scene{width:min(100%,450px)}.hero-bottom{margin:0 20px;font-size:8px}.page-content{padding-top:42px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}.about-layout{grid-template-columns:1fr;gap:18px}}
@media(max-width:430px){header{padding:0 13px}nav{gap:10px}nav a{font-size:8px}.social{display:none}.gallery{grid-template-columns:1fr}.project-image{aspect-ratio:5/3}footer{flex-direction:column}}
</style></head><body><main class="site" id="top"><header><a class="logo" href="index.html" aria-label="Home">sw</a><nav aria-label="Main navigation"><a class="" href="index.html">Home</a><a class="" href="portfolio.html">Portfolio</a><a class="" href="about.html">About</a><a class="active" href="contact.html">Contact</a></nav><a class="social" href="contact.html">↗ &nbsp; ✳ &nbsp; ○</a></header><section class="page-content"><div class="eyebrow">SAY HELLO</div><h1 class="page-title">Let’s make<br>something meaningful.</h1><p class="page-intro">Have a project, a question, or just want to say hi? I’d love to hear from you.</p><div class="contact-panel"><h2>Let’s talk.</h2><p>Replace this email with your preferred contact address.</p><a href="mailto:hello@example.com">EMAIL ME ↗</a></div></section><footer><span>© 2026 SELLYWORKING</span><span>MADE WITH INTENTION</span><a href="index.html">BACK HOME ↑</a></footer></main></body></html>
